AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Hacienda SFTP to S3 Download Application

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - prod

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where Lambda will be deployed (must have access to SFTP server)

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs for Lambda (at least 2 for HA)

  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group with outbound access to SFTP server (10.3.3.146:22)

  SftpHost:
    Type: String
    Default: "10.3.3.146"
    Description: SFTP server hostname/IP

  SftpPort:
    Type: String
    Default: "22"
    Description: SFTP server port

  SftpUsername:
    Type: String
    Description: SFTP username
    NoEcho: true

  SftpPassword:
    Type: String
    Description: SFTP password
    NoEcho: true

Globals:
  Function:
    Timeout: 900
    Runtime: python3.10
    MemorySize: 512

Resources:
  # S3 Bucket for downloaded files
  DownloadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'hacienda-sftp-downloads-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - POST
            AllowedOrigins:
              - '*'
            MaxAge: 3000
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # DynamoDB table for tracking download jobs
  DownloadJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'hacienda-sftp-download-jobs-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Secrets Manager for SFTP credentials
  SftpCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: hacienda-sftp-credentials
      Description: SFTP server credentials for file downloads
      SecretString: !Sub |
        {
          "host": "${SftpHost}",
          "port": "${SftpPort}",
          "username": "${SftpUsername}",
          "password": "${SftpPassword}"
        }

  # Cognito User Pool
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: hacienda-sftp-client-users
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true

  # Cognito User Pool Client
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: hacienda-sftp-web-client
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders:
        - COGNITO

  # Lambda execution role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'hacienda-sftp-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: SftpDownloadPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:CopyObject
                  - s3:DeleteObject
                Resource:
                  - !GetAtt DownloadsBucket.Arn
                  - !Sub '${DownloadsBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref SftpCredentialsSecret
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:Hacienda_ERP_MSSQL_Production*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:Sterling_SFTP_Direct_Production*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:Hacienda_ERP_Test_MSSQL_text*'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt DownloadJobsTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - states:StartExecution
                  - states:StopExecution
                  - states:DescribeExecution
                  - states:GetExecutionHistory
                  - states:ListExecutions
                Resource: '*'

  # Lambda function for SFTP download
  SftpDownloadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-sftp-download-${Environment}'
      CodeUri: ../lambda/sftp_download/
      Handler: handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - !Ref SecurityGroupId
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          S3_BUCKET: !Ref DownloadsBucket
          SECRETS_ARN: !Ref SftpCredentialsSecret
          JOBS_TABLE: !Ref DownloadJobsTable
          REMOTE_DOWNLOAD_FOLDER: /GPR/HCM
      Events:
        StartDownload:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /download
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # Lambda function for checking download status
  DownloadStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-sftp-download-status-${Environment}'
      CodeUri: ../lambda/sftp_download/
      Handler: handler.status_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          JOBS_TABLE: !Ref DownloadJobsTable
          S3_BUCKET: !Ref DownloadsBucket
      Events:
        GetStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /download/status/{jobId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  # Lambda function for listing downloaded files
  ListFilesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-sftp-list-files-${Environment}'
      CodeUri: ../lambda/sftp_download/
      Handler: handler.list_files_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          S3_BUCKET: !Ref DownloadsBucket
      Events:
        ListFiles:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /files
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  # ============================================================================
  # NEW: File Validation and Workflow Lambda Functions
  # ============================================================================

  # Lambda function for file name validation
  ValidateFilesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-validate-files-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.workflow_handler.validate_files_step
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          S3_BUCKET: !Ref DownloadsBucket
          JOBS_TABLE: !Ref DownloadJobsTable
      Events:
        ValidateFiles:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /validate
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # Lambda function for completeness checking
  CheckCompletenessFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-check-completeness-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.workflow_handler.check_completeness_step
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          S3_BUCKET: !Ref DownloadsBucket
          JOBS_TABLE: !Ref DownloadJobsTable
      Events:
        CheckCompleteness:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /completeness
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # Lambda function for duplicate detection
  CheckDuplicatesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-check-duplicates-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.workflow_handler.check_duplicates_step
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          S3_BUCKET: !Ref DownloadsBucket
          JOBS_TABLE: !Ref DownloadJobsTable
      Events:
        CheckDuplicates:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /duplicates
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # Lambda function for database loading (requires VPC for SQL Server access)
  LoadDatabaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-load-database-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.workflow_handler.load_database_step
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 900
      MemorySize: 1024
      VpcConfig:
        SecurityGroupIds:
          - !Ref SecurityGroupId
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          S3_BUCKET: !Ref DownloadsBucket
          JOBS_TABLE: !Ref DownloadJobsTable
          DB_SERVER: "10.0.151.32"
          DB_DATABASE: "Hacienda_ERP"
      Events:
        LoadDatabase:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /load
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # Lambda function for complete workflow orchestration
  WorkflowFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-workflow-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.workflow_handler.run_complete_workflow
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 900
      MemorySize: 1024
      VpcConfig:
        SecurityGroupIds:
          - !Ref SecurityGroupId
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          S3_BUCKET: !Ref DownloadsBucket
          JOBS_TABLE: !Ref DownloadJobsTable
          SECRETS_ARN: !Ref SftpCredentialsSecret
          DB_SERVER: "10.0.151.32"
          DB_DATABASE: "Hacienda_ERP"
      Events:
        RunWorkflow:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /workflow
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # Lambda function for workflow status
  WorkflowStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-workflow-status-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.workflow_handler.get_workflow_status
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          JOBS_TABLE: !Ref DownloadJobsTable
      Events:
        GetWorkflowStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /workflow/status/{jobId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  # ============================================================================
  # Integrated Validation Workflow
  # ============================================================================

  # Lambda function for integrated validation workflow (run-workflow)
  IntegratedWorkflowFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-integrated-workflow-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.workflow_handler.run_validation_workflow_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 900
      MemorySize: 1024
      VpcConfig:
        SecurityGroupIds:
          - !Ref SecurityGroupId
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          S3_BUCKET: !Ref DownloadsBucket
          JOBS_TABLE: !Ref DownloadJobsTable
          SQL_SECRET_NAME: Hacienda_ERP_MSSQL_Production
      Events:
        RunIntegratedWorkflow:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /run-workflow
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # ============================================================================
  # SQL Server Loading Functions
  # ============================================================================

  # Lambda function for SQL load preview
  SqlPreviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-sql-preview-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.sql_table_loader.preview_sql_load_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          S3_BUCKET: !Ref DownloadsBucket
      Events:
        PreviewSqlLoad:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /preview-load
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # Lambda function for SQL load execution
  SqlLoadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-sql-load-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.sql_table_loader.load_to_sql_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 900
      MemorySize: 1024
      VpcConfig:
        SecurityGroupIds:
          - !Ref SecurityGroupId
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          S3_BUCKET: !Ref DownloadsBucket
          SQL_SECRET_NAME: Hacienda_ERP_MSSQL_Production
      Events:
        LoadToSql:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /load-to-sql
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # ============================================================================
  # Full Pipeline Function
  # ============================================================================

  # Lambda function for running the full data processing pipeline
  FullPipelineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-full-pipeline-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.full_pipeline.run_full_pipeline_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 900
      MemorySize: 2048
      VpcConfig:
        SecurityGroupIds:
          - !Ref SecurityGroupId
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          S3_BUCKET: !Ref DownloadsBucket
          JOBS_TABLE: !Ref DownloadJobsTable
          SQL_SECRET_NAME: Hacienda_ERP_MSSQL_Production
          SFTP_HOST: !Ref SftpHost
          SFTP_PORT: !Ref SftpPort
      Events:
        RunFullPipeline:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /full-pipeline
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # Lambda function for listing pipeline folders
  PipelineFoldersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-pipeline-folders-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.full_pipeline.get_pipeline_folders_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          S3_BUCKET: !Ref DownloadsBucket
      Events:
        ListPipelineFolders:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /pipeline-folders
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  # ============================================================================
  # Stored Procedure Execution Functions
  # ============================================================================

  # Lambda function for running HCM_MAIN_INTF stored procedure
  RunProcedureFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-run-procedure-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.proc_runner_handler.run_stored_procedure_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 900
      MemorySize: 1024
      VpcConfig:
        SecurityGroupIds:
          - !Ref SecurityGroupId
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          S3_BUCKET: !Ref DownloadsBucket
          SQL_SECRET_NAME: Hacienda_ERP_MSSQL_Production
      Events:
        RunProcedure:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /run-procedure
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # Lambda function for getting stored procedure status
  ProcedureStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-procedure-status-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.proc_runner_handler.get_procedure_status_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      VpcConfig:
        SecurityGroupIds:
          - !Ref SecurityGroupId
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          SQL_SECRET_NAME: Hacienda_ERP_MSSQL_Production
      Events:
        GetProcedureStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /procedure-status
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  # ============================================================================
  # Step Functions State Machine for Full Pipeline
  # ============================================================================

  # IAM Role for Step Functions
  StepFunctionsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'hacienda-stepfunctions-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt SftpDownloadFunction.Arn
                  - !GetAtt ValidateFilesFunction.Arn
                  - !GetAtt SqlLoadFunction.Arn
                  - !GetAtt RunProcedureFunction.Arn
                  - !GetAtt ProcedureStatusFunction.Arn
                  - !GetAtt FullPipelineFunction.Arn
                  - !GetAtt ProcStarterFunction.Arn
                  - !GetAtt DeltaExportFunction.Arn
                  - !GetAtt SftpUploadFunction.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  # Step Functions State Machine
  HaciendaPipelineStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub 'hacienda-full-pipeline-${Environment}'
      DefinitionUri: ./statemachine/pipeline.asl.json
      DefinitionSubstitutions:
        SftpDownloadFunctionArn: !GetAtt SftpDownloadFunction.Arn
        CreateFoldersFunctionArn: !GetAtt FullPipelineFunction.Arn
        ValidationFunctionArn: !GetAtt ValidateFilesFunction.Arn
        SqlLoadFunctionArn: !GetAtt SqlLoadFunction.Arn
        ProcStarterFunctionArn: !GetAtt ProcStarterFunction.Arn
        ProcStatusFunctionArn: !GetAtt ProcedureStatusFunction.Arn
        DeltaExportFunctionArn: !GetAtt DeltaExportFunction.Arn
        SftpUploadFunctionArn: !GetAtt SftpUploadFunction.Arn
        ReportGeneratorFunctionArn: !GetAtt FullPipelineFunction.Arn
      Role: !GetAtt StepFunctionsExecutionRole.Arn
      Tracing:
        Enabled: true

  # Lambda for starting stored procedure asynchronously
  ProcStarterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-proc-starter-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.proc_starter_handler.start_procedure_async
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 120
      MemorySize: 512
      VpcConfig:
        SecurityGroupIds:
          - !Ref SecurityGroupId
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          SQL_SECRET_NAME: Hacienda_ERP_MSSQL_Production
          S3_BUCKET: !Ref DownloadsBucket

  # Lambda for delta file export
  DeltaExportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-delta-export-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.delta_exporter.export_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 600
      MemorySize: 1024
      VpcConfig:
        SecurityGroupIds:
          - !Ref SecurityGroupId
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          S3_BUCKET: !Ref DownloadsBucket
          SQL_SECRET_NAME: Hacienda_ERP_MSSQL_Production

  # Lambda for SFTP upload
  SftpUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-sftp-upload-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.sftp_uploader.upload_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 600
      MemorySize: 512
      VpcConfig:
        SecurityGroupIds:
          - !Ref SecurityGroupId
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          S3_BUCKET: !Ref DownloadsBucket
          SFTP_SECRET_NAME: Sterling_SFTP_Direct_Production

  # API endpoint for starting Step Functions execution
  StartPipelineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-start-pipeline-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.pipeline_api_handler.start_pipeline_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref HaciendaPipelineStateMachine
          JOBS_TABLE: !Ref DownloadJobsTable
          S3_BUCKET: !Ref DownloadsBucket
      Events:
        StartPipeline:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /start-pipeline
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  # API endpoint for getting pipeline status
  PipelineStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-pipeline-status-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.pipeline_api_handler.get_pipeline_status_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref HaciendaPipelineStateMachine
          JOBS_TABLE: !Ref DownloadJobsTable
      Events:
        GetPipelineStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /pipeline-status/{executionId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  # ============================================================================
  # VPC Endpoint for S3
  # ============================================================================
  # NOTE: Lambda functions in a VPC need an S3 VPC Endpoint to access S3.
  # If your VPC already has an S3 VPC Endpoint configured, no action is needed.
  #
  # If you get S3 authorization errors like:
  #   "Authorization header requires 'Credential' parameter"
  # You need to create an S3 VPC Gateway Endpoint in your VPC:
  #
  # 1. Go to AWS Console > VPC > Endpoints
  # 2. Create Endpoint:
  #    - Service: com.amazonaws.us-east-1.s3 (Gateway type)
  #    - VPC: Select your VPC
  #    - Route Tables: Select the route table(s) for your private subnets
  # 3. The Lambda will then be able to access S3 through the VPC endpoint
  # ============================================================================

  # API Gateway
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'hacienda-sftp-api-${Environment}'
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient

  S3BucketName:
    Description: S3 bucket for downloaded files
    Value: !Ref DownloadsBucket

  DownloadFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt SftpDownloadFunction.Arn

  ValidateFunctionArn:
    Description: File validation Lambda function ARN
    Value: !GetAtt ValidateFilesFunction.Arn

  WorkflowFunctionArn:
    Description: Workflow orchestration Lambda function ARN
    Value: !GetAtt WorkflowFunction.Arn

  StateMachineArn:
    Description: Step Functions State Machine ARN
    Value: !Ref HaciendaPipelineStateMachine

  StartPipelineFunctionArn:
    Description: Start Pipeline API function ARN
    Value: !GetAtt StartPipelineFunction.Arn

  PipelineStatusFunctionArn:
