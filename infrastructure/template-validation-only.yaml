AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Hacienda File Validation API (No VPC Required)

Parameters:
  Environment:
    Type: String
    Default: prod

  S3BucketName:
    Type: String
    Default: hacienda-sftp-downloads
    Description: Existing S3 bucket for downloaded files

  CognitoUserPoolId:
    Type: String
    Description: Existing Cognito User Pool ID
    Default: us-east-1_B9L2aprTj

  CognitoUserPoolArn:
    Type: String
    Description: Existing Cognito User Pool ARN
    Default: arn:aws:cognito-idp:us-east-1:087243890715:userpool/us-east-1_B9L2aprTj

  # VPC Configuration for SQL Server access (same as TestFunction)
  VpcId:
    Type: String
    Description: VPC ID for SQL Server connectivity
    Default: vpc-021fa03b30758a270

  SubnetId:
    Type: String
    Description: Subnet ID for Lambda functions that need SQL Server access
    Default: subnet-08b10dbce706ef479

  SecurityGroupId:
    Type: String
    Description: Security Group ID for Lambda functions that need SQL Server access
    Default: sg-053f951a5563b6d5c

  SqlSecretName:
    Type: String
    Description: AWS Secrets Manager secret name for SQL Server connection string
    Default: Hacienda_ERP_Test_MSSQL_text

Globals:
  Function:
    Timeout: 300
    Runtime: python3.10
    MemorySize: 512

Resources:
  # DynamoDB table for tracking jobs
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'hacienda-sftp-download-jobs-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Lambda execution role (no VPC) - for validation functions
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'hacienda-validation-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ValidationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:HeadObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:CopyObject
                Resource:
                  - !Sub 'arn:aws:s3:::${S3BucketName}'
                  - !Sub 'arn:aws:s3:::${S3BucketName}/*'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource: !GetAtt JobsTable.Arn

  # Lambda execution role with VPC access - for SQL loading functions
  LambdaVpcExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'hacienda-sql-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: SqlLoaderPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:HeadObject
                  - s3:PutObject
                Resource:
                  - !Sub 'arn:aws:s3:::${S3BucketName}'
                  - !Sub 'arn:aws:s3:::${S3BucketName}/*'
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SqlSecretName}*'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource: !GetAtt JobsTable.Arn

  # Lambda function for file name validation
  ValidateFilesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-validate-files-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.workflow_handler.validate_files_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          S3_BUCKET: !Ref S3BucketName
          JOBS_TABLE: !Ref JobsTable
      Events:
        ValidateFiles:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /validate
            Method: POST

  # Lambda function for completeness checking
  CheckCompletenessFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-check-completeness-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.workflow_handler.check_completeness_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          S3_BUCKET: !Ref S3BucketName
          JOBS_TABLE: !Ref JobsTable
      Events:
        CheckCompleteness:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /completeness
            Method: POST

  # Lambda function for duplicate detection
  CheckDuplicatesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-check-duplicates-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.workflow_handler.check_duplicates_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          S3_BUCKET: !Ref S3BucketName
          JOBS_TABLE: !Ref JobsTable
      Events:
        CheckDuplicates:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /duplicates
            Method: POST

  # Lambda function for listing files
  ListFilesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-list-files-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.workflow_handler.list_files_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          S3_BUCKET: !Ref S3BucketName
      Events:
        ListFiles:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /files
            Method: GET

  # Lambda function for integrated validation workflow
  RunWorkflowFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-run-workflow-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.workflow_handler.run_workflow_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 600
      MemorySize: 1024
      Environment:
        Variables:
          S3_BUCKET: !Ref S3BucketName
          JOBS_TABLE: !Ref JobsTable
      Events:
        RunWorkflow:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /run-workflow
            Method: POST

  # Lambda function for previewing SQL load (what tables would be created)
  PreviewSqlLoadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-preview-sql-load-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.sql_table_loader.preview_load_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          S3_BUCKET: !Ref S3BucketName
      Events:
        PreviewLoad:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /preview-load
            Method: POST

  # Lambda function for loading files to SQL Server (requires VPC)
  LoadToSqlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-load-to-sql-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.sql_table_loader.load_to_sql_handler
      Role: !GetAtt LambdaVpcExecutionRole.Arn
      Timeout: 900
      MemorySize: 1024
      Layers:
        # pymssql layer for SQL Server connectivity (no ODBC drivers needed)
        - arn:aws:lambda:us-east-1:087243890715:layer:pymssql-python310:1
      Environment:
        Variables:
          S3_BUCKET: !Ref S3BucketName
          SQL_SECRET_NAME: !Ref SqlSecretName
      VpcConfig:
        SubnetIds:
          - !Ref SubnetId
        SecurityGroupIds:
          - !Ref SecurityGroupId
      Events:
        LoadToSql:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /load-to-sql
            Method: POST

  # Lambda function for running HCM_MAIN_INTF stored procedure (requires VPC)
  RunStoredProcedureFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-run-procedure-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.proc_runner_handler.run_stored_procedure_handler
      Role: !GetAtt LambdaVpcExecutionRole.Arn
      Timeout: 900  # 15 minutes - stored procedure can take a while
      MemorySize: 1024
      Layers:
        # pymssql layer for SQL Server connectivity
        - arn:aws:lambda:us-east-1:087243890715:layer:pymssql-python310:1
      Environment:
        Variables:
          S3_BUCKET: !Ref S3BucketName
          SQL_SECRET_NAME: !Ref SqlSecretName
      VpcConfig:
        SubnetIds:
          - !Ref SubnetId
        SecurityGroupIds:
          - !Ref SecurityGroupId
      Events:
        RunProcedure:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /run-procedure
            Method: POST

  # Lambda function for getting stored procedure status (requires VPC)
  GetProcedureStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'hacienda-procedure-status-${Environment}'
      CodeUri: ../lambda/
      Handler: sftp_download.proc_runner_handler.get_procedure_status_handler
      Role: !GetAtt LambdaVpcExecutionRole.Arn
      Timeout: 60
      MemorySize: 512
      Layers:
        # pymssql layer for SQL Server connectivity
        - arn:aws:lambda:us-east-1:087243890715:layer:pymssql-python310:1
      Environment:
        Variables:
          S3_BUCKET: !Ref S3BucketName
          SQL_SECRET_NAME: !Ref SqlSecretName
      VpcConfig:
        SubnetIds:
          - !Ref SubnetId
        SecurityGroupIds:
          - !Ref SecurityGroupId
      Events:
        GetStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /procedure-status
            Method: GET

  # API Gateway with Cognito Authorizer
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'hacienda-validation-api-${Environment}'
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      GatewayResponses:
        UNAUTHORIZED:
          StatusCode: 401
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Ref CognitoUserPoolArn

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'

  S3BucketName:
    Description: S3 bucket for files
    Value: !Ref S3BucketName

  ValidateFunctionArn:
    Description: Validate files Lambda ARN
    Value: !GetAtt ValidateFilesFunction.Arn

  PreviewSqlLoadFunctionArn:
    Description: Preview SQL Load Lambda ARN
    Value: !GetAtt PreviewSqlLoadFunction.Arn

  LoadToSqlFunctionArn:
    Description: Load to SQL Lambda ARN
    Value: !GetAtt LoadToSqlFunction.Arn

  RunWorkflowFunctionArn:
    Description: Run Workflow Lambda ARN
    Value: !GetAtt RunWorkflowFunction.Arn

  RunStoredProcedureFunctionArn:
    Description: Run Stored Procedure Lambda ARN
    Value: !GetAtt RunStoredProcedureFunction.Arn

  GetProcedureStatusFunctionArn:
    Description: Get Procedure Status Lambda ARN
    Value: !GetAtt GetProcedureStatusFunction.Arn
